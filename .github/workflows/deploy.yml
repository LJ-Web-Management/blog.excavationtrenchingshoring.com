name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Uploads are handled (converted + deployed) by convert-docx.yml. If this
    # workflow also ran on that same push, it would check out the commit as
    # it stood *before* conversion and could finish after that workflow's own
    # deploy, overwriting the freshly-published post with the stale state.
    paths-ignore:
      - "uploads/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
