name: Convert Word Docs to Blog Posts

on:
  push:
    branches: [main]
    paths:
      - "uploads/*.docx"
      - "uploads/*.txt"
      - "uploads/*.zip"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Convert uploaded documents to blog posts
        run: node scripts/convert.js

      - name: Commit generated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Publish blog post(s) from uploaded Word document(s)"
            git push
          fi

      # A push made with the workflow's own GITHUB_TOKEN (the commit above)
      # does not trigger the separate "Deploy to GitHub Pages" workflow, so
      # this job deploys the freshly-converted site itself.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
